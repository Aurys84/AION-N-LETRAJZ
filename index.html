<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Aion Labor - Profi Önéletrajz</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; padding: 20px; margin: 0; }
        .container { max-width: 650px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bb5; text-align: center; margin-bottom: 5px; }
        
        .ats-info { background: #eef7ff; border-left: 5px solid #007bb5; padding: 15px; margin: 20px 0; border-radius: 0 8px 8px 0; display: block !important; }
        .ats-info h4 { margin: 0 0 10px 0; color: #007bb5; text-transform: uppercase; font-size: 14px; font-weight: bold; }
        .ats-info ul { margin: 0; padding-left: 20px; list-style-type: disc !important; }
        .ats-info li { font-size: 13px; color: #333; line-height: 1.6; margin-bottom: 5px; display: list-item !important; }

        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0 20px 0; }
        .btn-lang { padding: 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; font-size: 13px; }
        .btn-hu { background: #2ecc71; grid-column: span 2; }
        .btn-en-mix { background: #3498db; }
        .btn-de-mix { background: #e67e22; }
        .btn-en-only { background: #1e3799; }
        .btn-de-only { background: #b33939; }
        .btn-lang.active { outline: 3px solid #333; transform: scale(0.98); box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }

        .gen-btn { width: 100%; padding: 18px; background: #007bb5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 17px; font-weight: bold; margin-top: 25px; }
        #kep-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: none; margin: 10px auto; border: 3px solid #007bb5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aion Mátrix - Önéletrajz</h2>

        <div class="ats-info">
            <h4>🚀 ROBOT-BIZTOS (ATS) TIPPEK:</h4>
            <ul>
                <li><strong>Szoftverek:</strong> Konkrét neveket írj (pl. SAP, Minitab, Predor)!</li>
                <li><strong>Mérhető eredmények:</strong> Használj számokat (pl. napi 200 vendég)!</li>
                <li><strong>Titulusok:</strong> Használj hivatalos megnevezéseket (pl. Raktárvezető)!</li>
            </ul>
        </div>

        <label>Profilkép:</label>
        <input type="file" id="kep-input" accept="image/*" onchange="previewKep()">
        <img id="kep-preview">

        <label>Nyelvi mód:</label>
        <div class="lang-grid">
            <button class="btn-lang btn-hu active" onclick="setMode('hu', this)">Csak Magyar</button>
            <button class="btn-lang btn-en-mix" onclick="setMode('en-mix', this)">HU + Angol</button>
            <button class="btn-lang btn-de-mix" onclick="setMode('de-mix', this)">HU + Német</button>
            <button class="btn-lang btn-en-only" onclick="setMode('en-only', this)">Csak Angol</button>
            <button class="btn-lang btn-de-only" onclick="setMode('de-only', this)">Csak Német</button>
        </div>
        
        <label>Design (10 szín):</label>
        <select id="szinvalaszto">
            <option value="#007bb5">Mátrix Kék</option>
            <option value="#1a3a5a">Éjfélkék</option>
            <option value="#4a4a4a">Antracit</option>
            <option value="#2ecc71">Smaragdzöld</option>
            <option value="#e67e22">Narancs</option>
            <option value="#b33939">Vörös</option>
            <option value="#8e44ad">Lila</option>
            <option value="#2c3e50">Pala</option>
            <option value="#d35400">Téglavörös</option>
            <option value="#16a085">Türkiz</option>
        </select>

        <label>Személyes adatok</label>
        <input type="text" id="nev" placeholder="Teljes Név">
        <input type="text" id="cim" placeholder="Város, Utca, Házszám">
        <input type="text" id="tel" placeholder="Telefonszám">
        <input type="email" id="email" placeholder="E-mail cím">
        
        <label>Tartalom</label>
        <textarea id="bemutat" placeholder="Bemutatkozás..." rows="3"></textarea>
        <textarea id="suli" placeholder="Tanulmányok..." rows="3"></textarea>
        <textarea id="tapa" placeholder="Tapasztalat..." rows="4"></textarea>
        <input type="text" id="kesz" placeholder="Készségek, szoftverek...">
        
        <button class="gen-btn" onclick="generalas()">PDF GENERÁLÁSA</button>
    </div>

    <script>
        let mode = 'hu';
        let profilKepData = "";

        function previewKep() {
            const file = document.getElementById('kep-input').files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                profilKepData = reader.result;
                const preview = document.getElementById('kep-preview');
                preview.src = reader.result; preview.style.display = 'block';
            };
            if (file) reader.readAsDataURL(file);
        }

        function setMode(m, btn) {
            mode = m;
            document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function translate(text, lang) {
            if (!text || lang === 'hu' || mode === 'hu') return ""; 
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=hu|${lang}`);
                const data = await res.json();
                return data.responseData.translatedText || "";
            } catch (e) { return ""; }
        }

        async function generalas() {
            const btn = document.querySelector('.gen-btn');
            btn.innerText = "FELDOLGOZÁS...";
            const lang = mode.split('-')[0];
            const isOnly = mode.includes('only');
            
            const adatok = {
                nev: document.getElementById('nev').value,
                cim: document.getElementById('cim').value,
                tel: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                bemutat: document.getElementById('bemutat').value,
                suli: document.getElementById('suli').value,
                tapa: document.getElementById('tapa').value,
                kesz: document.getElementById('kesz').value
            };

            const tr = {
                nev: (mode !== 'hu' && isOnly) ? await translate(adatok.nev, lang) : "",
                cim: (mode !== 'hu') ? await translate(adatok.cim, lang) : "",
                bemutat: (mode !== 'hu') ? await translate(adatok.bemutat, lang) : "",
                suli: (mode !== 'hu') ? await translate(adatok.suli, lang) : "",
                tapa: (mode !== 'hu') ? await translate(adatok.tapa, lang) : "",
                kesz: (mode !== 'hu') ? await translate(adatok.kesz, lang) : ""
            };

            const szin = document.getElementById('szinvalaszto').value;
            const dicts = {
                hu: { c: "ADATOK", s: "KÉSZSÉGEK", p: "PROFIL", e: "TANULMÁNYOK", ex: "TAPASZTALAT" },
                en: { c: "CONTACT", s: "SKILLS", p: "PROFILE", e: "EDUCATION", ex: "EXPERIENCE" },
                de: { c: "KONTAKT", s: "FÄHIGKEITEN", p: "PROFIL", e: "BILDUNG", ex: "ERFAHRUNG" }
            };
            const L = (k) => (mode === 'hu' ? dicts.hu[k] : (isOnly ? dicts[lang][k] : dicts.hu[k] + " / " + dicts[lang][k]));

            const html = `<html><head><meta charset="UTF-8"><style>
                body { font-family: sans-serif; display: flex; margin: 0; min-height: 100vh; color: #333; }
                .sidebar { background: ${szin}; color: white; width: 32%; padding: 30px; -webkit-print-color-adjust: exact; }
                .main { width: 68%; padding: 45px; background: white; }
                .p-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; object-fit: cover; margin-bottom: 20px; }
                h1 { margin:0; text-transform: uppercase; font-size: 26px; color: ${szin}; }
                h3 { border-bottom: 2px solid ${szin}; color: ${szin}; text-transform: uppercase; margin-top: 25px; font-size: 15px; padding-bottom: 5px; }
                .sidebar h3 { color: white; border-bottom: 1px solid rgba(255,255,255,0.3); }
                p { white-space: pre-line; line-height: 1.6; font-size: 14px; margin: 0 0 10px 0; }
                .tr { color: #666; font-style: italic; font-size: 13px; display: block; margin-top: -5px; margin-bottom: 10px; }
                .sidebar .tr { color: #ddd; }
                .no-print { position: fixed; top: 10px; right: 10px; padding: 12px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; }
            </style></head><body>
                <button class="no-print" onclick="window.print()">NYOMTATÁS / MENTÉS</button>
                <div class="sidebar">
                    ${profilKepData ? `<img src="${profilKepData}" class="p-img">` : ''}
                    <h3>${L('c')}</h3>
                    <p>${!isOnly ? adatok.cim : tr.cim}</p>
                    ${!isOnly && tr.cim ? `<span class="tr">${tr.cim}</span>` : ''}
                    <p>${adatok.tel}<br>${adatok.email}</p>
                    ${adatok.kesz ? `<h3>${L('s')}</h3><p>${!isOnly ? adatok.kesz : tr.kesz}</p>${!isOnly && tr.kesz ? `<span class="tr">${tr.kesz}</span>` : ''}` : ''}
                </div>
                <div class="main">
                    <h1>${!isOnly ? adatok.nev : tr.nev}</h1>
                    ${!isOnly && tr.nev ? `<span class="tr" style="font-size: 18px; text-transform: uppercase; margin-top: 5px;">${tr.nev}</span>` : ''}
                    ${adatok.bemutat ? `<h3>${L('p')}</h3><p>${!isOnly ? adatok.bemutat : tr.bemutat}</p>${!isOnly && tr.bemutat ? `<span class="tr">${tr.bemutat}</span>` : ''}` : ''}
                    ${adatok.suli ? `<h3>${L('e')}</h3><p>${!isOnly ? adatok.suli : tr.suli}</p>${!isOnly && tr.suli ? `<span class="tr">${tr.suli}</span>` : ''}` : ''}
                    ${adatok.tapa ? `<h3>${L('ex')}</h3><p>${!isOnly ? adatok.tapa : tr.tapa}</p>${!isOnly && tr.tapa ? `<span class="tr">${tr.tapa}</span>` : ''}` : ''}
                </div></body></html>`;
            
            const win = window.open("", "_blank");
            if (win) {
                win.document.write(html);
                win.document.close();
            } else {
                alert("Engedélyezd a felugró ablakokat a Brave-ben!");
            }
            btn.innerText = "PDF GENERÁLÁSA";
        }
    </script>
</body>
</html>
