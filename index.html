<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Aion Labor - Profi Önéletrajz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bb5; text-align: center; margin-bottom: 5px; }
        .ats-info { background: #eef7ff; border-left: 5px solid #007bb5; padding: 15px; margin-bottom: 20px; font-size: 13px; color: #333; line-height: 1.4; }
        .ats-info h4 { margin: 0 0 8px 0; color: #007bb5; text-transform: uppercase; font-size: 14px; }
        
        /* Fordító gombok stílusa */
        .lang-container { display: flex; justify-content: space-between; margin-bottom: 20px; background: #fff3cd; padding: 10px; border-radius: 5px; border: 1px dashed #ffa502; }
        .lang-btn { flex: 1; margin: 0 5px; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .en { background: #007bb5; }
        .de { background: #4a4a4a; }
        .lang-btn:hover { opacity: 0.8; transform: scale(1.02); }

        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .gen-btn { width: 100%; padding: 15px; background: #2ed573; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aion Mátrix - Önéletrajz</h2>
        <p style="text-align: center; font-size: 12px; color: #888; margin-bottom: 20px;">Csonka Norbert & Aion Labor</p>

        <div class="ats-info">
            <h4>🚀 ATS Tippek:</h4>
            <p>Töltsd ki magyarul, majd válassz nyelvet!</p>
        </div>
        
        <div class="lang-container">
            <button class="lang-btn en" onclick="translateAll('en')">🇺🇸 FORDÍTÁS: ANGOL</button>
            <button class="lang-btn de" onclick="translateAll('de')">🇩🇪 FORDÍTÁS: NÉMET</button>
        </div>
        
        <label>Válassz stílust:</label>
        <select id="szinvalaszto">
            <option value="#007bb5">Mátrix Kék</option>
            <option value="#1a3a5a">Éjfélkék</option>
            <option value="#4a4a4a">Antracit</option>
        </select>

        <label>Profilkép</label>
        <input type="file" id="foto" accept="image/*">
        <label>Személyes adatok</label>
        <input type="text" id="nev" placeholder="Név">
        <input type="text" id="cim" placeholder="Cím">
        <input type="text" id="tel" placeholder="Telefon">
        <input type="email" id="email" placeholder="Email">
        
        <label>Szakmai tartalom (Fordítható)</label>
        <textarea id="bemutat" placeholder="Bemutatkozás" rows="3"></textarea>
        <textarea id="suli" placeholder="Tanulmányok" rows="3"></textarea>
        <textarea id="tapa" placeholder="Tapasztalat" rows="4"></textarea>
        <input type="text" id="kesz" placeholder="Készségek">
        
        <button class="gen-btn" onclick="generalas()">PDF GENERÁLÁSA</button>
    </div>

    <script>
        async function translateAll(lang) {
            const fields = ['bemutat', 'suli', 'tapa', 'kesz'];
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "⏳ DOLGOZOM...";
            
            for (let id of fields) {
                const element = document.getElementById(id);
                if (element.value.trim() !== "") {
                    try {
                        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(element.value)}&langpair=hu|${lang}`);
                        const data = await res.json();
                        element.value = data.responseData.translatedText;
                    } catch (e) { console.error("Hiba!", e); }
                }
            }
            btn.innerText = originalText;
            alert("Aion: Kész a fordítás! Most már generálhatod a PDF-et.");
        }

        function generalas() {
            const fotoInput = document.getElementById('foto');
            const szin = document.getElementById('szinvalaszto').value;
            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { megjelenit(e.target.result, szin); };
                reader.readAsDataURL(fotoInput.files[0]);
            } else { megjelenit("", szin); }
        }

        function megjelenit(fotoData, szin) {
            const adatok = {
                nev: document.getElementById('nev').value,
                cim: document.getElementById('cim').value,
                tel: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                bemutat: document.getElementById('bemutat').value,
                suli: document.getElementById('suli').value,
                tapa: document.getElementById('tapa').value,
                kesz: document.getElementById('kesz').value
            };

            const html = `
                <html>
                <head>
                    <style>
                        @media print { .no-print { display: none; } }
                        body { font-family: sans-serif; display: flex; margin: 0; min-height: 100vh; }
                        .sidebar { background: ${szin}; color: white; width: 30%; padding: 25px; -webkit-print-color-adjust: exact; }
                        .main { width: 70%; padding: 40px; }
                        .profil-kep { width: 120px; height: 120px; border-radius: 50%; border: 3px solid white; object-fit: cover; }
                        h3 { border-bottom: 2px solid ${szin}; color: ${szin}; text-transform: uppercase; }
                        .sidebar h3 { color: white; border-bottom: 1px solid white; }
                        .no-print { position: fixed; top: 10px; right: 10px; padding: 10px; background: #2ed573; color: white; border: none; cursor: pointer; }
                    </style>
                </head>
                <body>
                    <button class="no-print" onclick="window.print()">MENTÉS</button>
                    <div class="sidebar">
                        ${fotoData ? `<img src="${fotoData}" class="profil-kep">` : ''}
                        <h3>ADATOK</h3><p>${adatok.cim}<br>${adatok.tel}<br>${adatok.email}</p>
                        ${adatok.kesz ? `<h3>KÉSZSÉGEK</h3><p>${adatok.kesz}</p>` : ''}
                    </div>
                    <div class="main">
                        <h1 style="color:${szin}">${adatok.nev}</h1>
                        ${adatok.bemutat ? `<h3>PROFIL</h3><p>${adatok.bemutat}</p>` : ''}
                        ${adatok.suli ? `<h3>ISKOLA</h3><p>${adatok.suli}</p>` : ''}
                        ${adatok.tapa ? `<h3>TAPASZTALAT</h3><p>${adatok.tapa}</p>` : ''}
                    </div>
                </body>
                </html>
            `;
            const win = window.open();
            win.document.write(html);
            win.document.close();
        }
    </script>
</body>
</html>
