<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Aion Labor - Profi Önéletrajz</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; padding: 20px; margin: 0; }
        .container { max-width: 650px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bb5; text-align: center; margin-bottom: 5px; }
        .ats-info { background: #eef7ff; border-left: 5px solid #007bb5; padding: 15px; margin-bottom: 25px; font-size: 13px; color: #333; line-height: 1.4; border-radius: 0 8px 8px 0; }
        .ats-info h4 { margin: 0 0 8px 0; color: #007bb5; text-transform: uppercase; font-size: 14px; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 25px; }
        .btn-lang { padding: 10px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; font-size: 12px; }
        .btn-hu { background: #2ecc71; grid-column: span 2; }
        .btn-en-mix { background: #3498db; }
        .btn-de-mix { background: #e67e22; }
        .btn-en-only { background: #1e3799; }
        .btn-de-only { background: #b33939; }
        .btn-lang.active { outline: 3px solid #333; transform: scale(0.98); }

        .gen-btn { width: 100%; padding: 18px; background: #007bb5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 17px; font-weight: bold; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aion Mátrix - Önéletrajz</h2>
        <div class="ats-info">
            <h4>🚀 Robot-biztos (ATS) Tippek:</h4>
            <ul>
                <li><strong>Csak Angol/Német:</strong> A címszavak (Profil, Tapasztalat stb.) is lefordulnak.</li>
                <li><strong>Kétnyelvű:</strong> Minden címszó két nyelven jelenik meg.</li>
            </ul>
        </div>

        <label>Válasszon PDF kimenetet:</label>
        <div class="lang-grid">
            <button class="btn-lang btn-hu active" onclick="setMode('hu', this)">Csak Magyar</button>
            <button class="btn-lang btn-en-mix" onclick="setMode('en-mix', this)">HU + Angol</button>
            <button class="btn-lang btn-de-mix" onclick="setMode('de-mix', this)">HU + Német</button>
            <button class="btn-lang btn-en-only" onclick="setMode('en-only', this)">Csak Angol</button>
            <button class="btn-lang btn-de-only" onclick="setMode('de-only', this)">Csak Német</button>
        </div>
        
        <label>Design stílus:</label>
        <select id="szinvalaszto">
            <option value="#007bb5">Mátrix Kék</option>
            <option value="#1a3a5a">Éjfélkék</option>
            <option value="#4a4a4a">Antracit</option>
        </select>

        <label>Személyes adatok</label>
        <input type="text" id="nev" placeholder="Név">
        <input type="text" id="cim" placeholder="Cím">
        <input type="text" id="tel" placeholder="Telefon">
        <input type="email" id="email" placeholder="Email">
        
        <textarea id="bemutat" placeholder="Bemutatkozás..." rows="3"></textarea>
        <textarea id="suli" placeholder="Tanulmányok..." rows="3"></textarea>
        <textarea id="tapa" placeholder="Tapasztalat..." rows="4"></textarea>
        <input type="text" id="kesz" placeholder="Készségek...">
        
        <button class="gen-btn" onclick="generalas()">PDF GENERÁLÁSA</button>
    </div>

    <script>
        let mode = 'hu';
        const dictionary = {
            hu: { contact: "ELÉRHETŐSÉG", skills: "KÉSZSÉGEK", profile: "PROFIL", edu: "TANULMÁNYOK", exp: "TAPASZTALAT" },
            en: { contact: "CONTACT", skills: "SKILLS", profile: "PROFILE", edu: "EDUCATION", exp: "EXPERIENCE" },
            de: { contact: "KONTAKT", skills: "FÄHIGKEITEN", profile: "PROFIL", edu: "BILDUNG", exp: "ERFAHRUNG" }
        };

        function setMode(m, btn) {
            mode = m;
            document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function translate(text, lang) {
            if (!text || lang === 'hu') return "";
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=hu|${lang}`);
                const data = await res.json();
                return data.responseData.translatedText;
            } catch (e) { return ""; }
        }

        async function generalas() {
            const btn = event.target;
            btn.innerText = "FORDÍTÁS ÉS GENERÁLÁS...";
            const lang = mode.split('-')[0];
            
            const data = {
                nev: document.getElementById('nev').value,
                cim: document.getElementById('cim').value,
                tel: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                bemutat: document.getElementById('bemutat').value,
                suli: document.getElementById('suli').value,
                tapa: document.getElementById('tapa').value,
                kesz: document.getElementById('kesz').value,
                bemutat_tr: await translate(document.getElementById('bemutat').value, lang),
                suli_tr: await translate(document.getElementById('suli').value, lang),
                tapa_tr: await translate(document.getElementById('tapa').value, lang),
                kes_tr: await translate(document.getElementById('kesz').value, lang)
            };

            megjelenit(document.getElementById('szinvalaszto').value, data, mode);
            btn.innerText = "PDF GENERÁLÁSA";
        }

        function megjelenit(szin, d, m) {
            const isOnly = m.includes('only');
            const lang = m.split('-')[0];
            const dict = dictionary[lang];
            const huDict = dictionary['hu'];

            const getLabel = (key) => {
                if (m === 'hu') return huDict[key];
                if (isOnly) return dict[key];
                return `${huDict[key]} / ${dict[key]}`;
            };

            const html = `<html><head><style>
                body { font-family: sans-serif; display: flex; margin: 0; min-height: 100vh; }
                .sidebar { background: ${szin}; color: white; width: 32%; padding: 30px; -webkit-print-color-adjust: exact; }
                .main { width: 68%; padding: 45px; }
                h3 { border-bottom: 2px solid ${szin}; color: ${szin}; text-transform: uppercase; margin-top: 25px; font-size: 16px; letter-spacing: 1px; }
                .sidebar h3 { color: white; border-bottom: 1px solid rgba(255,255,255,0.5); }
                p { white-space: pre-line; line-height: 1.5; font-size: 14px; margin-bottom: 5px; }
                .tr { color: #666; font-style: italic; font-size: 13.5px; display: block; margin-bottom: 10px; }
                .sidebar .tr { color: #ccc; }
                .no-print { position: fixed; top: 10px; right: 10px; padding: 12px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold; }
            </style></head><body>
                <button class="no-print" onclick="window.print()">MENTÉS PDF</button>
                <div class="sidebar">
                    <h3>${getLabel('contact')}</h3><p>${d.cim}<br>${d.tel}<br>${d.email}</p>
                    ${d.kesz ? `<h3>${getLabel('skills')}</h3><p>${!isOnly ? d.kesz : ''}</p>${d.kes_tr ? `<span class="tr">${isOnly ? '' : '[ '}${d.kes_tr}${isOnly ? '' : ' ]'}</span>` : ''}` : ''}
                </div>
                <div class="main">
                    <h1 style="color:${szin}; margin:0; text-transform: uppercase;">${d.nev}</h1>
                    ${d.bemutat ? `<h3>${getLabel('profile')}</h3><p>${!isOnly ? d.bemutat : ''}</p>${d.bemutat_tr ? `<span class="tr">${isOnly ? '' : '[ '}${d.bemutat_tr}${isOnly ? '' : ' ]'}</span>` : ''}` : ''}
                    ${d.suli ? `<h3>${getLabel('edu')}</h3><p>${!isOnly ? d.suli : ''}</p>${d.suli_tr ? `<span class="tr">${isOnly ? '' : '[ '}${d.suli_tr}${isOnly ? '' : ' ]'}</span>` : ''}` : ''}
                    ${d.tapa ? `<h3>${getLabel('exp')}</h3><p>${!isOnly ? d.tapa : ''}</p>${d.tapa_tr ? `<span class="tr">${isOnly ? '' : '[ '}${d.tapa_tr}${isOnly ? '' : ' ]'}</span>` : ''}` : ''}
                </div></body></html>`;
            const win = window.open();
            win.document.write(html); win.document.close();
        }
    </script>
</body>
</html>
