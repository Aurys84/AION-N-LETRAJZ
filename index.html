<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Aion Mátrix - Profi Önéletrajz</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; padding: 20px; margin: 0; }
        .container { max-width: 650px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bb5; text-align: center; margin-bottom: 5px; }
        
        /* TÁJÉKOZTATÓ FIXÁLVA */
        .ats-info { background: #eef7ff; border-left: 5px solid #007bb5; padding: 15px; margin-bottom: 25px; font-size: 13px; color: #333; line-height: 1.4; border-radius: 0 8px 8px 0; display: block !important; }
        .ats-info h4 { margin: 0 0 8px 0; color: #007bb5; text-transform: uppercase; font-size: 14px; }
        
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 25px; }
        .btn-lang { padding: 10px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; font-size: 12px; }
        .btn-hu { background: #2ecc71; grid-column: span 2; }
        .btn-en-mix { background: #3498db; }
        .btn-de-mix { background: #e67e22; }
        .btn-en-only { background: #1e3799; }
        .btn-de-only { background: #b33939; }
        .btn-lang.active { outline: 3px solid #333; transform: scale(0.98); }
        .gen-btn { width: 100%; padding: 18px; background: #007bb5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 17px; font-weight: bold; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aion Mátrix - Önéletrajz</h2>
        
        <div class="ats-info" id="info-box">
            <h4>🚀 Robot-biztos (ATS) Tippek:</h4>
            <ul>
                <li><strong>Cím formátum:</strong> Kérjük, így adja meg: <em>Város, Utca, Házszám</em>.</li>
                <li><strong>Nyelv:</strong> Az "Only" módokban a név és cím is lefordul.</li>
                <li><strong>Stílus:</strong> 10 szín közül választhat.</li>
            </ul>
        </div>

        <label>Válasszon módot:</label>
        <div class="lang-grid">
            <button class="btn-lang btn-hu active" onclick="setMode('hu', this)">Csak Magyar</button>
            <button class="btn-lang btn-en-mix" onclick="setMode('en-mix', this)">HU + Angol</button>
            <button class="btn-lang btn-de-mix" onclick="setMode('de-mix', this)">HU + Német</button>
            <button class="btn-lang btn-en-only" onclick="setMode('en-only', this)">Csak Angol</button>
            <button class="btn-lang btn-de-only" onclick="setMode('de-only', this)">Csak Német</button>
        </div>
        
        <label>Design (10 szín):</label>
        <select id="szinvalaszto">
            <option value="#007bb5">Mátrix Kék</option>
            <option value="#1a3a5a">Éjfélkék</option>
            <option value="#4a4a4a">Antracit</option>
            <option value="#2ecc71">Smaragdzöld</option>
            <option value="#e67e22">Narancs</option>
            <option value="#b33939">Vörös</option>
            <option value="#8e44ad">Lila</option>
            <option value="#2c3e50">Pala</option>
            <option value="#d35400">Téglavörös</option>
            <option value="#16a085">Türkiz</option>
        </select>

        <label>Személyes adatok</label>
        <input type="text" id="nev" placeholder="Teljes Név">
        <input type="text" id="cim" placeholder="Lakcím (Város, Utca, Házszám)">
        <input type="text" id="tel" placeholder="Telefonszám">
        <input type="email" id="email" placeholder="E-mail cím">
        
        <label>Szakmai tartalom</label>
        <textarea id="bemutat" placeholder="Bemutatkozás..." rows="3"></textarea>
        <textarea id="suli" placeholder="Tanulmányok..." rows="3"></textarea>
        <textarea id="tapa" placeholder="Tapasztalat..." rows="4"></textarea>
        <input type="text" id="kesz" placeholder="Készségek...">
        
        <button class="gen-btn" onclick="generalas()">PDF GENERÁLÁSA</button>
    </div>

    <script>
        let mode = 'hu';
        const dictionary = {
            hu: { contact: "ADATOK", skills: "KÉSZSÉGEK", profile: "PROFIL", edu: "TANULMÁNYOK", exp: "TAPASZTALAT" },
            en: { contact: "CONTACT", skills: "SKILLS", profile: "PROFILE", edu: "EDUCATION", exp: "EXPERIENCE" },
            de: { contact: "KONTAKT", skills: "FÄHIGKEITEN", profile: "PROFIL", edu: "BILDUNG", exp: "ERFAHRUNG" }
        };

        function setMode(m, btn) {
            mode = m;
            document.querySelectorAll('.btn-lang').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function translate(text, lang) {
            if (!text || lang === 'hu') return text || "";
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=hu|${lang}`);
                const data = await res.json();
                return data.responseData.translatedText || text;
            } catch (e) { return text; }
        }

                kes_tr: await translate(document.getElementById('kesz').value, lang)
            };

            const szin = document.getElementById('szinvalaszto').value;
