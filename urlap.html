<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Aion Labor - Profi Önéletrajz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bb5; text-align: center; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bb5; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        button:hover { background: #005f8d; }
        .info { font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Aion Mátrix - Profi Önéletrajz</h2>
        
        <label>Profilkép feltöltése</label>
        <input type="file" id="foto" accept="image/*">

        <label>Teljes név</label>
        <input type="text" id="nev" placeholder="Kovács János">
        
        <label>Elérhetőségek</label>
        <input type="text" id="cim" placeholder="Lakcím">
        <input type="text" id="tel" placeholder="Telefonszám">
        <input type="email" id="email" placeholder="E-mail">

        <label>Bemutatkozás</label>
        <textarea id="bemutat" rows="3"></textarea>
        
        <label>Tanulmányok</label>
        <textarea id="suli" rows="3"></textarea>
        
        <label>Munkatapasztalat</label>
        <textarea id="tapa" rows="4"></textarea>
        
        <label>Készségek</label>
        <input type="text" id="kesz">

        <button onclick="generalas()">ÖNÉLETRAJZ GENERÁLÁSA</button>
        <p class="info">Ha nem nyílik meg, engedélyezd a felugró ablakokat a böngészőben!</p>
    </div>

    <script>
        function generalas() {
            const fotoInput = document.getElementById('foto');
            let fotoUrl = "";

            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    megjelenit(e.target.result);
                };
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                megjelenit("");
            }
        }

        function megjelenit(fotoData) {
            const adatok = {
                nev: document.getElementById('nev').value,
                cim: document.getElementById('cim').value,
                tel: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                bemutat: document.getElementById('bemutat').value,
                suli: document.getElementById('suli').value,
                tapa: document.getElementById('tapa').value,
                kesz: document.getElementById('kesz').value
            };

            const htmlTartalom = `
                <html>
                <head>
                    <style>
                        @media print { .no-print { display: none; } }
                        body { font-family: sans-serif; display: flex; margin: 0; min-height: 100vh; }
                        .sidebar { background: #007bb5; color: white; width: 30%; padding: 25px; text-align: center; }
                        .main { width: 70%; padding: 40px; }
                        .profil-kep { width: 150px; height: 150px; border-radius: 50%; border: 4px solid white; object-fit: cover; margin-bottom: 20px; background: #eee; }
                        h3 { border-bottom: 2px solid #007bb5; color: #007bb5; padding-bottom: 5px; }
                        .sidebar h3 { color: white; border-bottom-color: white; }
                        p { white-space: pre-line; line-height: 1.5; }
                        .no-print { position: fixed; top: 20px; right: 20px; padding: 15px; background: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <button class="no-print" onclick="window.print()">NYOMTATÁS / MENTÉS PDF</button>
                    <div class="sidebar">
                        ${fotoData ? `<img src="${fotoData}" class="profil-kep">` : '<div class="profil-kep" style="display:flex;align-items:center;justify-content:center;color:#999">Nincs kép</div>'}
                        <h3>ELÉRHETŐSÉG</h3>
                        <p>${adatok.cim}<br>${adatok.tel}<br>${adatok.email}</p>
                        <h3>KÉSZSÉGEK</h3>
                        <p>${adatok.kesz}</p>
                    </div>
                    <div class="main">
                        <h1>${adatok.nev}</h1>
                        <h3>BEMUTATKOZÁS</h3><p>${adatok.bemutat}</p>
                        <h3>TANULMÁNYOK</h3><p>${adatok.suli}</p>
                        <h3>MUNKATAPASZTALAT</h3><p>${adatok.tapa}</p>
                    </div>
                </body>
                </html>
            `;

            const ujAblak = window.open();
            if (!ujAblak) {
                alert("Huncutka! A böngésződ blokkolta a lapot. Kérlek, engedélyezd a felugró ablakokat a címsor jobb szélén!");
            } else {
                ujAblak.document.write(htmlTartalom);
            }
        }
    </script>
</body>
</html>
